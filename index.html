        // === ✂️ 十字框选区域 OCR 并自动调出弹窗视窗 ===
        let lastCropRatioX = null;
        let lastCropRatioY = null;

        async function processCropOcrAndOpenModal(left, top, width, height) {
            const hasDoc = (currentDocType === 'image' && currentImageFiles && currentImageFiles.length > 0) || !!currentPdfDoc;
            if (!hasDoc) return;
            const currentPageNum = parseInt(document.getElementById('page-input').value) || 1;
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-index="${currentPageNum}"]`);
            if (!targetWrapper) return;

            const pdfCanvas = targetWrapper.querySelector('.pdf-canvas');
            if (!pdfCanvas) return;

            // 1. 立刻弹出文本弹窗视窗
            const modal = document.getElementById('text-extract-modal');
            const textarea = document.getElementById('text-extract-content');
            const badge = document.getElementById('text-extract-badge');
            const statusEl = document.getElementById('text-extract-status');

            modal.style.display = 'flex';
            textarea.value = '正在裁剪并识字您框选区域内的图像文字，请稍候...';
            badge.innerText = '🔍 局部框选 OCR';
            badge.className = 'extract-tag-badge ocr-mode';
            statusEl.innerText = '正在读取框选区域文本...';

            try {
                await loadTesseractLibrary();

                const canvasRect = pdfCanvas.getBoundingClientRect();
                const cropX = Math.max(0, (left - canvasRect.left) * (pdfCanvas.width / canvasRect.width));
                const cropY = Math.max(0, (top - canvasRect.top) * (pdfCanvas.height / canvasRect.height));
                const cropW = Math.min(pdfCanvas.width - cropX, width * (pdfCanvas.width / canvasRect.width));
                const cropH = Math.min(pdfCanvas.height - cropY, height * (pdfCanvas.height / canvasRect.height));

                // 计算选框偏右下角位置 (将便签钉在框选区域的右下角，避免遮挡框内文字)
                lastCropRatioX = (cropX + cropW * 0.82) / pdfCanvas.width;
                lastCropRatioY = (cropY + cropH * 0.82) / pdfCanvas.height;

                // 超分辨率放缩与对比度滤镜预处理，极大地提升 Tesseract.js 对变音符号和字形边缘的识别准确率
                const scale = Math.max(2.5, Math.min(4.0, 1800000 / (cropW * cropH)));
                const procW = Math.round(cropW * scale);
                const procH = Math.round(cropH * scale);

                const procCanvas = document.createElement('canvas');
                procCanvas.width = procW;
                procCanvas.height = procH;
                const procCtx = procCanvas.getContext('2d');
                procCtx.imageSmoothingEnabled = true;
                procCtx.imageSmoothingQuality = 'high';
                procCtx.drawImage(pdfCanvas, cropX, cropY, cropW, cropH, 0, 0, procW, procH);

                // 灰度增强与动态对比度调整，消除黄底背景与杂色干扰
                const imgData = procCtx.getImageData(0, 0, procW, procH);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                    const v = gray > 185 ? 255 : (gray < 80 ? 0 : gray);
                    d[i] = v; d[i + 1] = v; d[i + 2] = v;
                }
                procCtx.putImageData(imgData, 0, 0);

                let worker;
                try {
                    // 支持葡语(por)、西语(spa)、英语(eng)、中文(chi_sim)
                    worker = await Tesseract.createWorker('por+spa+eng+chi_sim', 1);
                } catch (langErr) {
                    console.warn("多语言包加载受限，降级为 eng+chi_sim", langErr);
                    worker = await Tesseract.createWorker('chi_sim+eng', 1);
                }

                const ret = await worker.recognize(procCanvas.toDataURL('image/png'));
                await worker.terminate();

                let croppedText = (ret.data && ret.data.text) ? ret.data.text.trim() : '';

                // OCR 常见变音符号与字符识别补丁矫正
                croppedText = croppedText
                    .replace(/^£\s*/gm, 'É ')
                    .replace(/^eae\s*/gm, 'É ')
                    .replace(/Colambia/g, 'Colômbia')
                    .replace(/Quem é7/g, 'Quem é?');

                if (croppedText) {
                    textarea.value = croppedText;
                    statusEl.innerText = `框选识别成功！整洁提取 ${croppedText.length} 个字符`;
                    showToast("✅ 已成功将框选区域文字整洁提取入弹窗！");

                    // 同步在页面框选位置上渲染精确的蓝色可划词透明层 (需还原为物理坐标)
                    if (ret.data && ret.data.words) {
                        const globalWords = ret.data.words.map(w => ({
                            ...w,
                            bbox: {
                                x0: (w.bbox.x0 / scale) + cropX,
                                y0: (w.bbox.y0 / scale) + cropY,
                                x1: (w.bbox.x1 / scale) + cropX,
                                y1: (w.bbox.y1 / scale) + cropY
                            }
                        }));
                        createOcrOverlayTextLayer(globalWords, targetWrapper, pdfCanvas.width, pdfCanvas.height);
                    }
                } else {
                    textarea.value = '未能在您框选的区域内检测到有效文字图像。';
                    statusEl.innerText = '未检测到文字';
                }
            } catch (err) {
                console.error("局部框选 OCR 产生错误:", err);
                textarea.value = "框选区域 OCR 识别发生异常：" + (err.message || err);
                statusEl.innerText = '识别失败';
            }

            viewSubMode = 'pan';
            updateViewSubModeHint();
        }

        document.getElementById('ctx-toggle-submode').addEventListener('click', () => {

        function updateCanvasCursor() {
            let cursorStyle = 'crosshair';
            if (currentTool === 'text') {

                if (viewSubMode === 'pan') {
                    cursorStyle = isPanDragging ? 'grabbing' : 'grab';

                canvas.style.cursor = cursorStyle;

            if (pdfContainer) {
                pdfContainer.style.cursor = cursorStyle;

            if (isPanDragging) {
                document.body.style.cursor = 'grabbing';

        function getOrCreateSelectionBox() {
            if (!selectionBoxEl) {
                selectionBoxEl = document.createElement('div');
                selectionBoxEl.id = 'zoom-selection-box';
                selectionBoxEl.style.cssText = `
                    position: fixed;
                    border: 2px dashed #007bff;
                    background: rgba(0, 123, 255, 0.25);
                    pointer-events: none;
                    z-index: 10000;
                    display: none;
                    box-shadow: 0 0 12px rgba(0, 123, 255, 0.6);
                    border-radius: 4px;
                `;
                document.body.appendChild(selectionBoxEl);
            }
            return selectionBoxEl;
        }

        document.addEventListener('mousedown', (e) => {
            if (currentTool !== 'view') return;

            // 必须在 #pdf-container 主可视区域内触发，且排除悬浮面板、按钮、输入框、透明文字选择层等交互控件
            if (!e.target.closest('#pdf-container')) return;
            if (e.target.closest('#pdf-toolbar, #mini-panel, #top-right-fab, #custom-context-menu, #note-detail-modal, #text-extract-modal, #history-modal, .temp-text-box, .canvas-text-caret, .ocr-word, button, input, textarea, a, label, .color-dot')) return;

            if (viewSubMode === 'select_zoom') {
                isBoxSelecting = true;
                boxStartX = e.clientX;
                boxStartY = e.clientY;
                const box = getOrCreateSelectionBox();
                box.style.left = boxStartX + 'px';
                box.style.top = boxStartY + 'px';
                box.style.width = '0px';
                box.style.height = '0px';
                box.style.display = 'block';
                e.preventDefault();
            } else if (viewSubMode === 'pan') {
                isPanDragging = true;
                panStartX = e.clientX;
                panStartY = e.clientY;
                panScrollLeft = pdfContainer.scrollLeft;
                panScrollTop = pdfContainer.scrollTop;
                updateCanvasCursor();

                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (currentTool !== 'view') return;

            if (isBoxSelecting && selectionBoxEl) {
                const currentX = e.clientX;
                const currentY = e.clientY;
                const left = Math.min(boxStartX, currentX);
                const top = Math.min(boxStartY, currentY);
                const width = Math.abs(currentX - boxStartX);
                const height = Math.abs(currentY - boxStartY);

                selectionBoxEl.style.left = left + 'px';
                selectionBoxEl.style.top = top + 'px';
                selectionBoxEl.style.width = width + 'px';
                selectionBoxEl.style.height = height + 'px';
            } else if (isPanDragging) {
                const dx = e.clientX - panStartX;
                const dy = e.clientY - panStartY;
                pdfContainer.scrollLeft = panScrollLeft - dx;
                pdfContainer.scrollTop = panScrollTop - dy;
                spawnTrailParticle(e.clientX, e.clientY); // 拖拽移动过程中飘落小微粒
            }
        });

        let isZoomToRectScrolling = false;

        function zoomToBoxRect(left, top, width, height) {
            const hasDoc = (currentDocType === 'image' && currentImageFiles && currentImageFiles.length > 0) || !!currentPdfDoc;
            if (width < 10 || height < 10 || !hasDoc) return;

            const containerRect = pdfContainer.getBoundingClientRect();

            // 1. 找到框选中心点所落在的 .page-wrapper
            const centerX = left + width / 2;
            const centerY = top + height / 2;
            const wrappers = Array.from(document.querySelectorAll('.page-wrapper'));

            let targetWrapper = wrappers.find(w => {
                const r = w.getBoundingClientRect();
                return centerX >= r.left && centerX <= r.right && centerY >= r.top && centerY <= r.bottom;
            }) || wrappers[0];

            if (!targetWrapper) return;

            const wrapperRect = targetWrapper.getBoundingClientRect();

            // 2. 计算归一化相对页面百分比位置 (0.0 ~ 1.0)
            const relX = Math.max(0, (left - wrapperRect.left) / wrapperRect.width);
            const relY = Math.max(0, (top - wrapperRect.top) / wrapperRect.height);

            // 3. 计算使框选区域最大化铺满视口所需的放缩倍率
            const scaleX = containerRect.width / width;
            const scaleY = containerRect.height / height;
            const scaleFactor = Math.max(1.1, Math.min(scaleX, scaleY));

            const oldScale = currentCalculatedScale || 1.5;
            const targetScale = oldScale * scaleFactor;

            // 锁存标记，防止 renderPdf 重写 scroll
            isZoomToRectScrolling = true;

            setZoomScale(targetScale);

            // 4. 在 DOM 重构完成后，根据百分比比率精确对齐 Content
            setTimeout(() => {
                const pageIndex = targetWrapper.dataset.pageIndex;
                const newWrapper = document.querySelector(`.page-wrapper[data-page-index="${pageIndex}"]`) || targetWrapper;

                if (newWrapper) {
                    const newScrollLeft = newWrapper.offsetLeft + (relX * newWrapper.offsetWidth);
                    const newScrollTop = newWrapper.offsetTop + (relY * newWrapper.offsetHeight);

                    pdfContainer.scrollLeft = Math.max(0, newScrollLeft);
                    pdfContainer.scrollTop = Math.max(0, newScrollTop);
                }

                setTimeout(() => {
                    isZoomToRectScrolling = false;
                }, 350);
            }, 120);

            viewSubMode = 'pan';
            updateViewSubModeHint();
            showToast("🔍 已精准特写放大框选区域！");
        }

        document.addEventListener('mouseup', (e) => {
            if (isBoxSelecting && selectionBoxEl) {
                isBoxSelecting = false;
                const width = parseInt(selectionBoxEl.style.width) || 0;
                const height = parseInt(selectionBoxEl.style.height) || 0;
                const left = parseInt(selectionBoxEl.style.left) || 0;
                const top = parseInt(selectionBoxEl.style.top) || 0;
                selectionBoxEl.style.display = 'none';

                if (width > 20 && height > 20) {
                    if (isCropOcrActive) {
                        isCropOcrActive = false;
                        processCropOcrAndOpenModal(left, top, width, height);
                    } else {
                        zoomToBoxRect(left, top, width, height);
                    }
                }
            }

            if (isPanDragging) {
                isPanDragging = false;
                spawnHandGrabBurst(e.clientX, e.clientY, 8);

        // 滚轮差分响应：指针在 PDF 页面上 -> 缩放画面；指针在灰色画布上 -> 上下平移视图
        pdfContainer.addEventListener('wheel', (e) => {
            const isOnPdfPage = e.target.closest('.page-wrapper');

            if (isOnPdfPage) {
                // 指针在 PDF 页面/图片上 -> 缩放画面视图 (Zoom View)
                e.preventDefault();

                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
                const oldScale = currentCalculatedScale;
                const newScale = currentCalculatedScale * zoomFactor;

                const rect = pdfContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left + pdfContainer.scrollLeft;
                const mouseY = e.clientY - rect.top + pdfContainer.scrollTop;

                setZoomScale(newScale);

                setTimeout(() => {
                    const ratio = currentCalculatedScale / (oldScale || 1);
                    pdfContainer.scrollLeft = mouseX * ratio - (e.clientX - rect.left);
                    pdfContainer.scrollTop = mouseY * ratio - (e.clientY - rect.top);
                }, 50);
            } else {
                // 指针在灰色画布/背景上 -> 原生上下移动视图 (Vertical Scroll)
            }
        }, { passive: false });

        // === 侧边栏展开 / 收起控制 ===

        let isDraggingAudio = false, audioOffsetX = 0, audioOffsetY = 0;

        function toggleAudioPanel(collapse) {
            const panel = document.getElementById('mini-panel');

        if (audioPanelEl) {

        function audioMouseMove(e) {

            let y = Math.max(0, Math.min(e.clientY - audioOffsetY, window.innerHeight - audioPanel.offsetHeight));

        const btnPlay = document.getElementById('btn-play');
        const progressBar = document.getElementById('progress-bar');

        const progressHandle = document.getElementById('progress-handle');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function loadAudio(index, shouldPlay = true) {
            if (!audioFiles || audioFiles.length === 0) return;

            // 支持无限循环切歌：最前一首点上一曲跳到最后一首，最后一首点下一曲跳到第一首
            if (index < 0) index = audioFiles.length - 1;
            if (index >= audioFiles.length) index = 0;

            currentIndex = index;
            localStorage.setItem('audio_last_index', currentIndex);
            const file = audioFiles[currentIndex];
            if (!file) return;

            titleEl.innerText = `${currentIndex + 1}. ${file.name}`;
            titleEl.title = file.name;
            hoverMusicTitle.innerText = file.name;
            audioPanel.title = file.name;

            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });

            try {
                if (player._currentBlobUrl) {
                    URL.revokeObjectURL(player._currentBlobUrl);
                }
                const newUrl = URL.createObjectURL(file);
                player._currentBlobUrl = newUrl;
                player.src = newUrl;
                player.load(); // 强行刷新 HTML5 Audio 内部解码引擎

                if (shouldPlay) {
                    const playPromise = player.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            updatePlayStatusUI(true);
                        }).catch(err => {
                            console.warn('音频播放交互限制/拦截:', err);
                            updatePlayStatusUI(false);
                        });
                    }
                } else {
                    updatePlayStatusUI(false);
                }
            } catch (err) {
                console.warn('音频转换与载入异常:', err);
            }
        }

        function togglePlayPause() {
            if (!audioFiles || audioFiles.length === 0) {
                showToast("🎵 请先导入音频文件或包含音乐的文件夹！");
                return;
            }
            if (!player.src || player.src === '' || player.src === 'about:blank') {
                loadAudio(currentIndex, true);
                return;
            }
            if (player.paused) {
                const playPromise = player.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        updatePlayStatusUI(true);
                    }).catch(err => {
                        console.warn('播放失败，尝试重新加载:', err);
                        loadAudio(currentIndex, true);
                    });
                }
            } else {
                player.pause();
                updatePlayStatusUI(false);
            }
        }

        btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
        document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); loadAudio(currentIndex - 1, true); });
        document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); loadAudio(currentIndex + 1, true); });
        document.getElementById('btn-rewind').addEventListener('click', (e) => { e.stopPropagation(); if (player.duration) player.currentTime = Math.max(0, player.currentTime - 5); });
        document.getElementById('btn-forward').addEventListener('click', (e) => { e.stopPropagation(); if (player.duration) player.currentTime = Math.min(player.duration || 0, player.currentTime + 5); });

        player.addEventListener('play', () => updatePlayStatusUI(true));
        player.addEventListener('pause', () => updatePlayStatusUI(false));
        player.addEventListener('ended', () => { updatePlayStatusUI(false); player.currentTime = 0; });

        function updatePlayStatusUI(isPlaying) { btnPlay.innerText = isPlaying ? '⏸️' : '▶️'; }

        player.addEventListener('timeupdate', () => {
            if (!player.duration) return;
            const pct = (player.currentTime / player.duration) * 100;
            progressFill.style.width = pct + '%'; progressHandle.style.left = pct + '%';
            timeCurrent.innerText = formatTime(player.currentTime);
        });
        player.addEventListener('loadedmetadata', () => { timeTotal.innerText = formatTime(player.duration); });

        progressBar.addEventListener('mousedown', (e) => {
            const seek = (ev) => {
                if (!player.duration) return;
                const rect = progressBar.getBoundingClientRect();
                player.currentTime = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width)) * player.duration;
            };
            seek(e);
            document.addEventListener('mousemove', seek);
            document.addEventListener('mouseup', () => document.removeEventListener('mousemove', seek), { once: true });
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        window.addEventListener('keydown', function (e) {
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

            // === 笔迹批注 撤销/回退 (Ctrl+Z) 与 重做/前进 (Ctrl+Y / Ctrl+Shift+Z) ===
            const isCtrlOrCmd = e.ctrlKey || e.metaKey;
            if (isCtrlOrCmd && !e.altKey) {
                const key = e.key.toLowerCase();
                if (key === 'z') {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.shiftKey) {
                        document.getElementById('tool-redo').click();
                    } else {
                        document.getElementById('tool-undo').click();
                    }
                    return;
                }
                if (key === 'y') {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('tool-redo').click();
                    return;
                }
            }

            // === 音频快退 5 秒 (键 '[' 或 Alt+←) 与 快进 5 秒 (键 ']' 或 Alt+→) ===
            if (audioFiles.length > 0) {
                if (e.key === '[' || (e.altKey && e.key === 'ArrowLeft')) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('btn-rewind').click();
                    return;
                }
                if (e.key === ']' || (e.altKey && e.key === 'ArrowRight')) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('btn-forward').click();
                    return;
                }
            }

            // === PDF 及图片幻灯片 键盘翻页与移动控制 ===
            const totalDocPages = currentDocType === 'image' ? (currentImageFiles ? currentImageFiles.length : 0) : (currentPdfDoc ? currentPdfDoc.numPages : 0);
            if (totalDocPages > 0) {
                const currentPage = parseInt(document.getElementById('page-input').value) || 1;
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    e.stopPropagation();
                    scrollToPage(currentPage - 1, true);
                    return;
                }
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    e.preventDefault();
                    e.stopPropagation();
                    scrollToPage(currentPage + 1, true);
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    pdfContainer.scrollTop -= 60;
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    pdfContainer.scrollTop += 60;
                    return;
                }
            }

            // === 音频控制快捷键 (F1: 上一曲, F2: 播放/暂停, F3: 下一曲) ===
            if (audioFiles.length > 0) {
                if (e.key === 'F1') { e.preventDefault(); e.stopPropagation(); loadAudio(currentIndex - 1, true); }
                if (e.key === 'F2') { e.preventDefault(); e.stopPropagation(); togglePlayPause(); }
                if (e.key === 'F3') { e.preventDefault(); e.stopPropagation(); loadAudio(currentIndex + 1, true); }
            }
        }, true);

        // === 🛈 全局通用弹出视窗与 OCR 工具条拖拽引擎 ===
        function makeModalDraggable(modalEl, handleEl) {
            if (!modalEl || !handleEl) return;
            handleEl.style.cursor = 'move';
            if (!handleEl.title) handleEl.title = '按住顶部标题栏可拖拽移动窗口位置';

            let isDragging = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            handleEl.addEventListener('mousedown', (e) => {
                if (e.target.closest('button, input, textarea, a, label, .color-dot')) return;

                const rect = modalEl.getBoundingClientRect();
                modalEl.style.transform = 'none';
                modalEl.style.left = rect.left + 'px';
                modalEl.style.top = rect.top + 'px';
                modalEl.style.margin = '0';

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;

                const onMouseMove = (ev) => {
                    if (!isDragging) return;
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;

                    let newLeft = initialLeft + dx;
                    let newTop = initialTop + dy;

                    const maxLeft = Math.max(0, window.innerWidth - modalEl.offsetWidth);
                    const maxTop = Math.max(0, window.innerHeight - modalEl.offsetHeight);

                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));

                    modalEl.style.left = newLeft + 'px';
                    modalEl.style.top = newTop + 'px';
                };

                const onMouseUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            });
        }

        // === ⚙️ 右上角悬浮自选快捷插槽管理引擎 ===
        const CUSTOM_FAB_ACTIONS = [
            { id: 'draw', icon: '✏️', name: '画笔', run: () => switchTool('draw') },
            { id: 'highlight', icon: '🖍️', name: '高亮', run: () => switchTool('highlight') },
            { id: 'eraser', icon: '🧽', name: '擦除', run: () => switchTool('eraser') },
            { id: 'text', icon: '🔤', name: '打字', run: () => switchTool('text') },
            { id: 'note', icon: '📌', name: '便签', run: () => switchTool('note') },
            { id: 'crop_ocr', icon: '✂️', name: '框选识字', run: () => enableCropOcrMode() },
            { id: 'extract_layer', icon: '📝', name: '划词图层', run: () => toggleSelectionLayer() },
            { id: 'extract_modal', icon: '📋', name: '提取文本', run: () => openTextExtractModal() },
            { id: 'single_continuous', icon: '📄', name: '单页/连续', run: () => document.getElementById('tool-view-mode').click() },
            { id: 'fit_width', icon: '↔️', name: '宽度', run: () => document.getElementById('tool-fit-width').click() },
            { id: 'fit_page', icon: '↕️', name: '整页', run: () => document.getElementById('tool-fit-page').click() },
            { id: 'rotate_page', icon: '🔄', name: '旋转', run: () => rotatePdfView() },
            { id: 'sidebar', icon: '🖼️', name: '目录缩略图', run: () => document.getElementById('tool-toggle-sidebar').click() },
            { id: 'unload_audio', icon: '🚫', name: '卸载当前音频', run: () => unloadCurrentAudio() },
            { id: 'clear_history', icon: '🧹', name: '清空历史记录', run: () => document.getElementById('btn-clear-all-history').click() },
            { id: 'copy_page_img', icon: '📋', name: '复制本页图片', run: () => document.getElementById('ctx-copy-image').click() },
            { id: 'save_page_img', icon: '💾', name: '保存本页图片', run: () => document.getElementById('ctx-save-image').click() }
        ];

        let customSlotConfig = {};
        try {
            customSlotConfig = JSON.parse(localStorage.getItem('custom_fab_slots') || '{}');
        } catch (e) {
            customSlotConfig = {};
        }

        let activeConfiguringSlotIndex = 1;

        function renderCustomFabSlotsUI() {
            [1, 2, 3].forEach(index => {
                const btn = document.getElementById(`fab-custom-slot-${index}`);
                if (!btn) return;
                const actionId = customSlotConfig[index];
                const action = CUSTOM_FAB_ACTIONS.find(a => a.id === actionId);

                if (action) {
                    btn.innerHTML = `${action.icon} ${action.name}`;
                    btn.title = `自选插槽 ${index}：【${action.name}】(点击执行功能，右键可重设此卡槽)`;
                    btn.style.color = '#58a6ff';
                    btn.style.borderColor = 'rgba(88,166,255,0.45)';
                    btn.style.background = 'rgba(0,123,255,0.18)';
                } else {
                    btn.innerHTML = `➕ 自选${index}`;
                    btn.title = `自选快捷插槽 ${index} (点击或右键均可设置自选快捷键)`;
                    btn.style.color = '#aaa';
                    btn.style.borderColor = 'rgba(255,255,255,0.2)';
                    btn.style.background = 'rgba(35,35,35,0.9)';
                }
            });
        }

        function openCustomSlotModal(slotIndex) {
            activeConfiguringSlotIndex = slotIndex;
            const modal = document.getElementById('custom-slot-modal');
            const targetNameEl = document.getElementById('custom-slot-name-target');
            const listEl = document.getElementById('custom-slot-options-list');

            if (targetNameEl) targetNameEl.innerText = `自选插槽 ${slotIndex}`;
            listEl.innerHTML = '';

            const currentActionId = customSlotConfig[slotIndex];

            CUSTOM_FAB_ACTIONS.forEach(item => {
                const optBtn = document.createElement('button');
                const isSelected = (item.id === currentActionId);
                optBtn.style.cssText = `
                    background: ${isSelected ? 'rgba(0,123,255,0.35)' : 'rgba(255,255,255,0.06)'};
                    border: 1px solid ${isSelected ? '#007bff' : 'rgba(255,255,255,0.15)'};
                    color: ${isSelected ? '#58a6ff' : '#eee'};
                    padding: 8px 10px;
                    border-radius: 8px;
                    font-size: 12px;
                    font-weight: bold;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    text-align: left;
                    transition: all 0.15s ease;
                `;
                optBtn.innerHTML = `<span>${item.icon}</span><span>${item.name}</span>`;
                optBtn.addEventListener('click', () => {
                    customSlotConfig[slotIndex] = item.id;
                    localStorage.setItem('custom_fab_slots', JSON.stringify(customSlotConfig));
                    renderCustomFabSlotsUI();
                    showToast(`✅ 自选插槽 ${slotIndex} 已绑定为：【${item.name}】`);
                    modal.style.display = 'none';
                });
                listEl.appendChild(optBtn);
            });

            modal.style.display = 'flex';
        }

        [1, 2, 3].forEach(index => {
            const btn = document.getElementById(`fab-custom-slot-${index}`);
            if (!btn) return;

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const actionId = customSlotConfig[index];
                const action = CUSTOM_FAB_ACTIONS.find(a => a.id === actionId);
                if (action) {
                    action.run();
                } else {
                    openCustomSlotModal(index);
                }
            });

            btn.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openCustomSlotModal(index);
            });
        });

        document.getElementById('btn-close-custom-slot-modal').addEventListener('click', () => {
            document.getElementById('custom-slot-modal').style.display = 'none';
        });

        document.getElementById('btn-cancel-custom-slot').addEventListener('click', () => {
            document.getElementById('custom-slot-modal').style.display = 'none';
        });

        document.getElementById('btn-clear-custom-slot').addEventListener('click', () => {
            delete customSlotConfig[activeConfiguringSlotIndex];
            localStorage.setItem('custom_fab_slots', JSON.stringify(customSlotConfig));
            renderCustomFabSlotsUI();
            showToast(`🧹 自选插槽 ${activeConfiguringSlotIndex} 已重置清空`);
            document.getElementById('custom-slot-modal').style.display = 'none';
        });

        // 页面初始化完成后自动恢复界面状态并挂载可拖拽手势
        window.addEventListener('DOMContentLoaded', () => {
            restoreUIStates();
            autoRestoreCachedMedia();
            renderCustomFabSlotsUI();

            // 绑定卸载当前文档/图片与音频按钮
            const btnUnloadDoc = document.getElementById('btn-unload-doc');
            if (btnUnloadDoc) btnUnloadDoc.addEventListener('click', unloadCurrentDoc);

            const btnUnloadAudio = document.getElementById('btn-unload-audio');
            if (btnUnloadAudio) btnUnloadAudio.addEventListener('click', unloadCurrentAudio);

            const btnUnloadAudioMini = document.getElementById('btn-unload-audio-mini');
            if (btnUnloadAudioMini) btnUnloadAudioMini.addEventListener('click', unloadCurrentAudio);

            const ctxUnloadDoc = document.getElementById('ctx-unload-doc');
            if (ctxUnloadDoc) ctxUnloadDoc.addEventListener('click', () => {
                const ctxMenu = document.getElementById('custom-context-menu');
                if (ctxMenu) ctxMenu.style.display = 'none';
                unloadCurrentDoc();
            });

            const ctxUnloadAudio = document.getElementById('ctx-unload-audio');
            if (ctxUnloadAudio) ctxUnloadAudio.addEventListener('click', () => {
                const ctxMenu = document.getElementById('custom-context-menu');
                if (ctxMenu) ctxMenu.style.display = 'none';
                unloadCurrentAudio();
            });

            // 绑定全部弹出窗口与 OCR 悬浮条的可拖拽手势
            const noteModalEl = document.getElementById('note-detail-modal');
            if (noteModalEl) makeModalDraggable(noteModalEl, noteModalEl.querySelector('.note-modal-header'));

            const historyModalEl = document.getElementById('history-modal');
            if (historyModalEl) makeModalDraggable(historyModalEl, historyModalEl.querySelector('.history-modal-header'));

            const extractModalEl = document.getElementById('text-extract-modal');
            if (extractModalEl) makeModalDraggable(extractModalEl, extractModalEl.querySelector('.text-extract-header'));

            const cropActionBarEl = document.getElementById('crop-action-bar');
            if (cropActionBarEl) makeModalDraggable(cropActionBarEl, cropActionBarEl);

            const customSlotModalEl = document.getElementById('custom-slot-modal');
            if (customSlotModalEl) makeModalDraggable(customSlotModalEl, customSlotModalEl.querySelector('.custom-slot-modal-header'));
        });
    </script>
</body>

</html>
