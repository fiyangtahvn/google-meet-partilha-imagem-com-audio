        // === 文件解析 (支持加密 PDF 密码解密加载 & 本地 file:// 原生 ArrayBuffer 直解析) ===
        async function processPdfFile(file, isAutoLoad = false, password = '') {
            currentDocType = 'pdf';
            currentImageFiles = [];
            imageElementsCache = {};
            cachedPageDefaultViewports = {};
            if (pdfContainer) {
                pdfContainer.scrollTop = 0;
                pdfContainer.scrollLeft = 0;
            }

            const fileName = (file && file.name) ? file.name : 'pdf_doc';
            const fileSize = (file && file.size) ? file.size : 0;
            currentFileKey = 'hist_' + fileName + '_' + fileSize;

            try {
                const savedAnno = await getCachedMedia('annotations_' + currentFileKey);
                if (savedAnno && typeof savedAnno === 'object') pageLatestData = savedAnno;
                else if (!isAutoLoad) pageLatestData = {};

                const savedSticky = await getCachedMedia('sticky_notes_' + currentFileKey);
                if (savedSticky && typeof savedSticky === 'object') pageStickyNotes = savedSticky;
                else if (!isAutoLoad) pageStickyNotes = {};
            } catch (e) { }

            if (!isAutoLoad && !password) {
                saveCachedMedia('cached_pdf_file', file);
                deleteCachedMedia('cached_image_files');
                saveCachedMedia('cached_pdf_annotations', pageLatestData);
                saveCachedMedia('cached_pdf_sticky_notes', pageStickyNotes);
                localStorage.setItem('pdf_last_page', 1);
            }

            try {
                let pdfData;
                if (file instanceof ArrayBuffer) {
                    pdfData = new Uint8Array(file);
                } else if (file instanceof Blob || file instanceof File) {
                    pdfData = new Uint8Array(await file.arrayBuffer());
                } else {
                    pdfData = file;
                }

                const loadingTask = pdfjsLib.getDocument({
                    data: pdfData,
                    password: password,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
                    cMapPacked: true
                });

                loadingTask.promise.then(pdf => {
                    pdf._pdfName = (file && file.name) ? file.name : 'PDF 文档';
                    currentPdfDoc = pdf;
                    currentDocType = 'pdf';
                    currentImageFiles = [];
                    imageElementsCache = {};
                    historyStack = []; redoStack = [];
                    if (!isAutoLoad && !password) pageLatestData = {};
                    document.getElementById('page-total').innerText = `/ ${pdf.numPages}`;
                    document.getElementById('page-input').max = pdf.numPages;

                    // 自动载入时恢复保存的页码位置，而不是强制重置为第1页
                    const savedPage = isAutoLoad ? (parseInt(localStorage.getItem('pdf_last_page')) || 1) : 1;
                    const initialPage = Math.max(1, Math.min(savedPage, pdf.numPages));
                    document.getElementById('page-input').value = initialPage;

                    renderPdf();
                    initSidebarThumbnails();
                    saveFileToHistory(file, pdf.numPages, 'pdf');
                }).catch(error => {
                    if (error.name === 'PasswordException' || (error.message && error.message.toLowerCase().includes('password'))) {
                        promptPdfPassword(file, isAutoLoad, error.code === 2 || (error.message && error.message.toLowerCase().includes('incorrect')));
                    } else {
                        if (isAutoLoad) {
                            console.warn("自动加载上次 PDF 失败，可能文件不存在或损坏：" + error.message);
                        } else {
                            alert("PDF解析失败：" + error.message);
                        }
                    }
                });
            } catch (err) {
                console.error("解析或读取 PDF 文件产生异常:", err);
            }
        }

        // === 🔄 PDF 视图旋转引擎 (支持顺时针 90°/180°/270°/0° 循环旋转) ===
        let currentRotation = 0; // 0, 90, 180, 270

        function getPageViewport(page, scale) {
            const r = (page.rotate + currentRotation) % 360;
            return page.getViewport({ scale: scale, rotation: r });
        }

        function rotatePdfView() {
            const totalPages = currentDocType === 'image' ? (currentImageFiles ? currentImageFiles.length : 0) : (currentPdfDoc ? currentPdfDoc.numPages : 0);
            if (!totalPages) {
                showToast("⚠️ 当前未加载 PDF 文档或图片，无法旋转视图！");
                return;
            }
            currentRotation = (currentRotation + 90) % 360;
            const btnRotate = document.getElementById('tool-rotate-page');
            if (btnRotate) {
                btnRotate.innerText = `🔄 旋转 ${currentRotation}°`;
            }
            showToast(`🔄 视图已顺时针旋转至 ${currentRotation}°`);
            renderPdf();
            const sidebar = document.getElementById('pdf-sidebar');
            if (sidebar && !sidebar.classList.contains('sidebar-collapsed')) {
                initSidebarThumbnails();
            }
        }

        function promptPdfPassword(file, isAutoLoad, isIncorrect = false) {
            const pwd = prompt(isIncorrect ? "❌ 密码错误！请输入正确的 PDF 打开密码：" : "🔑 此 PDF 文件已受密码保护，请输入打开密码解密：");
            if (pwd !== null) {
                processPdfFile(file, isAutoLoad, pwd);
            }
        }

        function processAudioFilesList(files, isAutoLoad = false) {
            if (!isAutoLoad) {
                saveCachedMedia('cached_audio_files', files);
                localStorage.setItem('audio_last_index', 0);
                saveAudioFilesToHistory(files);
            }
            audioFiles = files.filter(file => {
                if (!file || !file.name) return false;
                const name = file.name.toLowerCase();
                return name.endsWith('.mp3') || name.endsWith('.m4a') || name.endsWith('.wav') || name.endsWith('.wma') || name.endsWith('.aac') || name.endsWith('.flac') || name.endsWith('.ogg');
            }).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            if (audioFiles.length > 0) {
                if (audioPanel) audioPanel.style.display = 'flex';
                playlistMenu.innerHTML = '';

                audioFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.title = file.name;
                    item.innerText = `${index + 1}. ${file.name}`;
                    item.onclick = (e) => {
                        e.stopPropagation();
                        playlistMenu.style.display = 'none';
                        loadAudio(index, true);
                    };
                    playlistMenu.appendChild(item);
                });

                if (!isAutoLoad) {
                    currentIndex = 0;
                    loadAudio(currentIndex, false);
                    showToast(`🎵 已成功加载 ${audioFiles.length} 首音频文件！`);
                }
            } else {
                if (audioPanel) audioPanel.style.display = 'none';
                if (!isAutoLoad) alert("未找到支持的音频文件(MP3/M4A/WAV/FLAC等)！");
            }
        }

        document.getElementById('pdf-selector').addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length > 0) smartProcessFilesList(e.target.files);
        });
        const imgFolderSelector = document.getElementById('image-folder-selector');
        if (imgFolderSelector) {
            imgFolderSelector.addEventListener('change', function (e) {
                if (e.target.files && e.target.files.length > 0) smartProcessFilesList(e.target.files);
            });
        }
        document.getElementById('audio-file-selector').addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length > 0) processAudioFilesList(Array.from(e.target.files));
        });
        document.getElementById('audio-folder-selector').addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length > 0) processAudioFilesList(Array.from(e.target.files));
        });

        // === PDF 渲染核心控制 (支持低精快照 + 高精按需防抖 + 单页演示模式) ===
        function calculateScale(viewportDefault) {
            const availW = Math.max(200, pdfContainer.clientWidth - 90);
            if (currentScaleMode === 'fit_width') {
                currentCalculatedScale = Math.max(0.2, availW / viewportDefault.width);
            } else if (currentScaleMode === 'fit_page') {
                const scaleW = availW / viewportDefault.width;
                const scaleH = (pdfContainer.clientHeight - 50) / viewportDefault.height;
                currentCalculatedScale = Math.max(0.2, Math.min(scaleW, scaleH));
            } else if (currentScaleMode === 'custom') {
                currentCalculatedScale = customScaleValue;
            } else {
                currentCalculatedScale = 1.5;
            }

            updateZoomPercentDisplay();
            return currentCalculatedScale;
        }

        function updateZoomPercentDisplay() {
            const pct = Math.round((currentCalculatedScale / 1.5) * 100);
            const zoomInputEl = document.getElementById('zoom-percent-input');
            if (zoomInputEl && document.activeElement !== zoomInputEl) {
                zoomInputEl.value = pct;
            }
        }

        async function renderPdf() {
            if (currentDocType === 'image') {
                renderImageDoc();
                return;
            }
            if (!currentPdfDoc) return;

            const activePageNum = parseInt(document.getElementById('page-input').value) || 1;

            if (viewMode === 'single') {
                renderSinglePage(activePageNum);
                return;
            }

            // === 连续滚动模式 ===
            pdfContainer.innerHTML = '';
            if (pageObserver) pageObserver.disconnect();

            // 清理旧定时器与未完成高清任务
            Object.values(renderTimers).forEach(clearTimeout);
            renderTimers = {};
            Object.values(activeRenderTasks).forEach(task => task && task.cancel && task.cancel());
            activeRenderTasks = {};

            const firstPage = await currentPdfDoc.getPage(1);
            const viewportDefault = getPageViewport(firstPage, 1);
            const scale = calculateScale(viewportDefault);
            const availW = Math.max(200, pdfContainer.clientWidth - 90);

            // 瞬间建立精确匹配各页实际尺寸的占位框
            for (let i = 1; i <= currentPdfDoc.numPages; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper placeholder';
                wrapper.dataset.pageIndex = i;
                wrapper.dataset.renderedLow = "false";
                wrapper.dataset.renderedHigh = "false";

                let pageDefaultVp = cachedPageDefaultViewports[i];
                if (!pageDefaultVp) {
                    const pageObj = await currentPdfDoc.getPage(i);
                    pageDefaultVp = getPageViewport(pageObj, 1);
                    cachedPageDefaultViewports[i] = pageDefaultVp;
                }

                const pageScale = (currentScaleMode === 'fit_width')
                    ? (availW / pageDefaultVp.width)
                    : scale;

                const targetW = Math.round(pageDefaultVp.width * pageScale);
                const targetH = Math.round(pageDefaultVp.height * pageScale);

                wrapper.style.width = targetW + 'px';
                wrapper.style.height = targetH + 'px';

                wrapper.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#888; font-size:13px; background:#e9ecef; border:1px dashed #ccc;">第 ${i} 页 (未载入)</div>`;

                pdfContainer.appendChild(wrapper);
            }

            // 观察者：视口前后扩充扫描
            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target;
                    const pageNum = parseInt(wrapper.dataset.pageIndex);

                    if (entry.isIntersecting) {
                        if (wrapper.dataset.renderedLow === "false") {
                            renderLowResPreview(pageNum, wrapper, scale);
                        }
                        if (wrapper.dataset.renderedHigh === "false" && !renderTimers[pageNum]) {
                            renderTimers[pageNum] = setTimeout(() => {
                                renderHighResPage(pageNum, wrapper, scale);
                                delete renderTimers[pageNum];
                            }, 80);
                        }
                    }
                });
            }, {
                root: pdfContainer,
                rootMargin: '1000px 0px 1000px 0px'
            });

            document.querySelectorAll('.page-wrapper').forEach(el => pageObserver.observe(el));

            // 立刻对当前视口及周边页面 (包含第 1、2 页) 触发渲染
            triggerNeighborhoodPreload(activePageNum, scale);

            setTimeout(() => {
                if (!isZoomToRectScrolling) {
                    scrollToPage(activePageNum, true);
                }
            }, 50);
        }

        // === 图片文档全局渲染逻辑 ===
        function renderImageDoc() {
            if (!currentImageFiles || currentImageFiles.length === 0) return;
            const activePageNum = parseInt(document.getElementById('page-input').value) || 1;

            if (viewMode === 'single') {
                renderSingleImagePage(activePageNum);
                return;
            }

            pdfContainer.innerHTML = '';
            if (pageObserver) pageObserver.disconnect();

            currentImageFiles.forEach((file, index) => {
                const pageNum = index + 1;
                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                wrapper.dataset.pageIndex = pageNum;

                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-canvas';
                wrapper.appendChild(pdfCanvas);

                const drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'draw-canvas';
                if (currentTool === 'text') drawCanvas.classList.add('text-mode');
                wrapper.appendChild(drawCanvas);

                pdfContainer.appendChild(wrapper);
                initDrawingEvents(drawCanvas, pageNum);

                loadAndDrawImageOnWrapper(file, wrapper, pdfCanvas, drawCanvas, pageNum);
            });

            setTimeout(() => {
                if (!isZoomToRectScrolling) {
                    scrollToPage(activePageNum, true);
                }
            }, 50);
        }

        function centerPageInViewport(wrapper) {
            if (!wrapper || !pdfContainer) return;
            setTimeout(() => {
                const containerRect = pdfContainer.getBoundingClientRect();
                const pageRect = wrapper.getBoundingClientRect();
                const targetScrollTop = (pageRect.height > containerRect.height)
                    ? Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top))
                    : Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top) - (containerRect.height - pageRect.height) / 2);
                const targetScrollLeft = Math.max(0, pdfContainer.scrollLeft + (pageRect.left - containerRect.left) - Math.max(0, (containerRect.width - pageRect.width) / 2));
                pdfContainer.scrollLeft = Math.max(0, targetScrollLeft);
                pdfContainer.scrollTop = Math.max(0, targetScrollTop);
            }, 30);
        }

        function loadAndDrawImageOnWrapper(file, wrapper, pdfCanvas, drawCanvas, pageNum) {
            const cached = imageElementsCache[file.name];
            const drawIt = (img) => {
                const rawW = img.naturalWidth || 800;
                const rawH = img.naturalHeight || 600;

                const isRotated = (currentRotation === 90 || currentRotation === 270);
                const rotatedW = isRotated ? rawH : rawW;
                const rotatedH = isRotated ? rawW : rawH;

                const scale = calculateScale({ width: rotatedW, height: rotatedH });

                const w = Math.round(rotatedW * scale);
                const h = Math.round(rotatedH * scale);

                wrapper.style.width = w + 'px';
                wrapper.style.height = h + 'px';
                pdfCanvas.width = w; pdfCanvas.height = h;
                drawCanvas.width = w; drawCanvas.height = h;

                const ctx = pdfCanvas.getContext('2d');
                ctx.save();
                if (currentRotation === 90) {
                    ctx.translate(w, 0); ctx.rotate(90 * Math.PI / 180);
                    ctx.drawImage(img, 0, 0, h, w);
                } else if (currentRotation === 180) {
                    ctx.translate(w, h); ctx.rotate(180 * Math.PI / 180);
                    ctx.drawImage(img, 0, 0, w, h);
                } else if (currentRotation === 270) {
                    ctx.translate(0, h); ctx.rotate(270 * Math.PI / 180);
                    ctx.drawImage(img, 0, 0, h, w);
                } else {
                    ctx.drawImage(img, 0, 0, w, h);
                }
                ctx.restore();

                restorePageCanvas(pageNum, drawCanvas);
                renderPageStickyNotes(pageNum, wrapper);

                // 自动居中定位至背景画布视口中央
                centerPageInViewport(wrapper);
            };

            if (cached) {
                drawIt(cached);
            } else {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    imageElementsCache[file.name] = img;
                    drawIt(img);
                };
                img.src = url;
            }
        }

        function renderSingleImagePage(pageNum) {
            if (!currentImageFiles || currentImageFiles.length === 0) return;
            pageNum = Math.max(1, Math.min(pageNum, currentImageFiles.length));

            pdfContainer.innerHTML = '';
            if (pageObserver) pageObserver.disconnect();

            const file = currentImageFiles[pageNum - 1];
            if (!file) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.dataset.pageIndex = pageNum;

            const pdfCanvas = document.createElement('canvas');
            pdfCanvas.className = 'pdf-canvas';
            wrapper.appendChild(pdfCanvas);

            const drawCanvas = document.createElement('canvas');
            drawCanvas.className = 'draw-canvas';
            if (currentTool === 'text') drawCanvas.classList.add('text-mode');
            wrapper.appendChild(drawCanvas);

            pdfContainer.appendChild(wrapper);
            initDrawingEvents(drawCanvas, pageNum);

            loadAndDrawImageOnWrapper(file, wrapper, pdfCanvas, drawCanvas, pageNum);

            document.getElementById('page-input').value = pageNum;
            localStorage.setItem('pdf_last_page', pageNum);
        }

        // === 阶梯式平滑预加载机制 (当前页的前2页与后2页 $[N-2, N+2]$) ===
        let preloadTimersQueue = [];

        function triggerNeighborhoodPreload(centerPageNum, scale) {
            if (!currentPdfDoc || viewMode === 'single') return;

            // 清理上一轮未触发的预加载队列
            preloadTimersQueue.forEach(clearTimeout);
            preloadTimersQueue = [];

            // 加载顺序优先级：当前页 (0) -> 前1页与后1页 (±1) -> 前2页与后2页 (±2)
            const offsets = [0, 1, -1, 2, -2];

            offsets.forEach(offset => {
                const targetPage = centerPageNum + offset;
                if (targetPage < 1 || targetPage > currentPdfDoc.numPages) return;

                const wrapper = document.querySelector(`.page-wrapper[data-page-index="${targetPage}"]`);
                if (!wrapper) return;

                const dist = Math.abs(offset);
                // 阶梯防抖延迟：当前页0ms / 1级100ms / 2级250ms，避免多页并发造成主线程卡顿
                const delayLow = dist * 100;
                const delayHigh = dist * 180 + (dist === 0 ? 50 : 120);

                const timerLow = setTimeout(() => {
                    if (wrapper.dataset.renderedLow === "false") {
                        renderLowResPreview(targetPage, wrapper, scale);
                    }
                }, delayLow);

                const timerHigh = setTimeout(() => {
                    if (wrapper.dataset.renderedHigh === "false" && !renderTimers[targetPage]) {
                        renderHighResPage(targetPage, wrapper, scale);
                    }
                }, delayHigh);

                preloadTimersQueue.push(timerLow, timerHigh);
            });
        }

        function ensurePageCanvases(pageNum, wrapper, viewport) {
            let pdfCanvas = wrapper.querySelector('.pdf-canvas');
            let drawCanvas = wrapper.querySelector('.draw-canvas');

            if (!pdfCanvas || !drawCanvas) {
                wrapper.innerHTML = '';
                pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-canvas';
                wrapper.appendChild(pdfCanvas);

                drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'draw-canvas';
                if (currentTool === 'text') drawCanvas.classList.add('text-mode');
                wrapper.appendChild(drawCanvas);

                initDrawingEvents(drawCanvas, pageNum);
            }

            const targetW = Math.round(viewport.width);
            const targetH = Math.round(viewport.height);

            wrapper.style.width = targetW + 'px';
            wrapper.style.height = targetH + 'px';

            if (pdfCanvas.width !== targetW || pdfCanvas.height !== targetH) {
                pdfCanvas.width = targetW;
                pdfCanvas.height = targetH;
            }
            if (drawCanvas.width !== targetW || drawCanvas.height !== targetH) {
                drawCanvas.width = targetW;
                drawCanvas.height = targetH;
            }

            return { pdfCanvas, drawCanvas };
        }

        // 阶段一：低清速查缩略图
        function renderLowResPreview(pageNum, wrapper, scale) {
            if (wrapper.dataset.renderedHigh === "true" || wrapper.dataset.renderedLow === "true") return;
            wrapper.dataset.renderedLow = "true";

            currentPdfDoc.getPage(pageNum).then(page => {
                const defaultViewport = getPageViewport(page, 1);
                const pageScale = (currentScaleMode === 'fit_width')
                    ? (Math.max(200, pdfContainer.clientWidth - 90) / defaultViewport.width)
                    : scale;
                const fullViewport = getPageViewport(page, pageScale);

                const { pdfCanvas, drawCanvas } = ensurePageCanvases(pageNum, wrapper, fullViewport);

                const lowScale = pageScale * 0.3;
                const lowViewport = getPageViewport(page, lowScale);

                const ctx = pdfCanvas.getContext('2d');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = Math.round(lowViewport.width);
                tempCanvas.height = Math.round(lowViewport.height);
                const tempCtx = tempCanvas.getContext('2d');

                page.render({ canvasContext: tempCtx, viewport: lowViewport }).promise.then(() => {
                    if (wrapper.dataset.renderedHigh !== "true") {
                        ctx.imageSmoothingEnabled = true;
                        ctx.drawImage(tempCanvas, 0, 0, pdfCanvas.width, pdfCanvas.height);
                        restorePageCanvas(pageNum, drawCanvas);
                        renderPageStickyNotes(pageNum, wrapper);
                    }
                }).catch(() => { });
            }).catch(() => {
                wrapper.dataset.renderedLow = "false";
            });
        }

        // 阶段二：高清原图渲染 (scale)
        function renderHighResPage(pageNum, wrapper, scale) {
            if (wrapper.dataset.renderedHigh === "true") return;

            currentPdfDoc.getPage(pageNum).then(page => {
                const defaultViewport = getPageViewport(page, 1);
                const pageScale = (currentScaleMode === 'fit_width')
                    ? (Math.max(200, pdfContainer.clientWidth - 90) / defaultViewport.width)
                    : scale;
                const viewport = getPageViewport(page, pageScale);

                const { pdfCanvas, drawCanvas } = ensurePageCanvases(pageNum, wrapper, viewport);

                wrapper.dataset.renderedHigh = "true";
                const pdfContext = pdfCanvas.getContext('2d');
                pdfContext.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);

                const renderTask = page.render({ canvasContext: pdfContext, viewport: viewport });
                activeRenderTasks[pageNum] = renderTask;

                renderTask.promise.then(() => {
                    delete activeRenderTasks[pageNum];
                    restorePageCanvas(pageNum, drawCanvas);
                    renderPageStickyNotes(pageNum, wrapper);
                    createInvisibleTextLayer(pageNum, wrapper);
                }).catch(err => {
                    delete activeRenderTasks[pageNum];
                    if (err && err.name !== 'RenderingCancelledException') {
                        wrapper.dataset.renderedHigh = "false";
                    }
                });
            }).catch(() => {
                wrapper.dataset.renderedHigh = "false";
            });
        }

        // 单页/幻灯片演示模式
        function renderSinglePage(pageNum) {
            if (!currentPdfDoc) return;
            pageNum = Math.max(1, Math.min(pageNum, currentPdfDoc.numPages));

            pdfContainer.innerHTML = '';
            if (pageObserver) pageObserver.disconnect();

            currentPdfDoc.getPage(pageNum).then(page => {
                const viewportDefault = getPageViewport(page, 1);
                const scale = calculateScale(viewportDefault);
                const viewport = getPageViewport(page, scale);

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                wrapper.style.width = viewport.width + 'px';
                wrapper.style.height = viewport.height + 'px';
                wrapper.dataset.pageIndex = pageNum;

                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-canvas';
                pdfCanvas.width = viewport.width; pdfCanvas.height = viewport.height;
                wrapper.appendChild(pdfCanvas);

                const drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'draw-canvas';
                if (currentTool === 'text') drawCanvas.classList.add('text-mode');
                drawCanvas.width = viewport.width; drawCanvas.height = viewport.height;
                wrapper.appendChild(drawCanvas);

                pdfContainer.appendChild(wrapper);
                initDrawingEvents(drawCanvas, pageNum);

                const pdfContext = pdfCanvas.getContext('2d');
                page.render({ canvasContext: pdfContext, viewport: viewport }).promise.then(() => {
                    restorePageCanvas(pageNum, drawCanvas);
                    renderPageStickyNotes(pageNum, wrapper);
                    if (isSelectLayerActive) {
                        processCurrentPageSelectionLayer(pageNum);
                    } else {
                        createInvisibleTextLayer(pageNum, wrapper);
                        const layer = wrapper.querySelector('.ocr-text-layer');
                        if (layer) layer.style.display = 'none';
                    }
                });

                document.getElementById('page-input').value = pageNum;
                localStorage.setItem('pdf_last_page', pageNum);
                if (!isZoomToRectScrolling) {
                    setTimeout(() => {
                        const containerRect = pdfContainer.getBoundingClientRect();
                        const pageRect = wrapper.getBoundingClientRect();
                        const targetScrollTop = (pageRect.height > containerRect.height)
                            ? Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top))
                            : Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top) - (containerRect.height - pageRect.height) / 2);
                        const targetScrollLeft = Math.max(0, pdfContainer.scrollLeft + (pageRect.left - containerRect.left) - Math.max(0, (containerRect.width - pageRect.width) / 2));
                        pdfContainer.scrollLeft = Math.max(0, targetScrollLeft);
                        pdfContainer.scrollTop = Math.max(0, targetScrollTop);
                    }, 50);
                }
            });
        }

        // 跳转控制 (支持瞬间定位与单页切换)
        function scrollToPage(targetPage, instant = true) {
            const totalPages = currentDocType === 'image' ? (currentImageFiles ? currentImageFiles.length : 0) : (currentPdfDoc ? currentPdfDoc.numPages : 0);
            if (!totalPages) return;
            targetPage = Math.max(1, Math.min(targetPage, totalPages));
            document.getElementById('page-input').value = targetPage;
            localStorage.setItem('pdf_last_page', targetPage);
            updateActiveThumbnail(targetPage);

            if (viewMode === 'single') {
                if (currentDocType === 'image') {
                    renderSingleImagePage(targetPage);
                } else {
                    renderSinglePage(targetPage);
                }
                return;
            }

            const pageDiv = document.querySelector(`.page-wrapper[data-page-index="${targetPage}"]`);
            if (pageDiv && pdfContainer) {
                const containerRect = pdfContainer.getBoundingClientRect();
                const pageRect = pageDiv.getBoundingClientRect();
                const targetScrollTop = (pageRect.height > containerRect.height)
                    ? Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top))
                    : Math.max(0, pdfContainer.scrollTop + (pageRect.top - containerRect.top) - (containerRect.height - pageRect.height) / 2);
                const targetScrollLeft = Math.max(0, pdfContainer.scrollLeft + (pageRect.left - containerRect.left) - Math.max(0, (containerRect.width - pageRect.width) / 2));

                pdfContainer.scrollTo({
                    top: Math.max(0, targetScrollTop),
                    left: Math.max(0, targetScrollLeft),
                    behavior: instant ? 'auto' : 'smooth'
                });
            }

            triggerNeighborhoodPreload(targetPage, 1.5);
        }

        // === 右侧侧边栏 缩略图目录控制 (延迟按需加载 + 高亮与自动同步) ===
        function initSidebarThumbnails() {
            const totalPages = currentDocType === 'image' ? (currentImageFiles ? currentImageFiles.length : 0) : (currentPdfDoc ? currentPdfDoc.numPages : 0);
            if (!totalPages) return;
            const container = document.getElementById('sidebar-thumbnails');
            container.innerHTML = '';
            if (thumbObserver) thumbObserver.disconnect();

            for (let i = 1; i <= totalPages; i++) {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                item.dataset.pageIndex = i;
                item.dataset.rendered = "false";
                item.innerHTML = `<div style="height:72px; width:54px; display:flex; align-items:center; justify-content:center; color:#666; font-size:10px; background:rgba(255,255,255,0.03); border-radius:2px;">第 ${i} 页</div><div class="thumb-label">${i}</div>`;

                item.addEventListener('click', () => {
                    scrollToPage(i, true);
                });

                container.appendChild(item);
            }

            thumbObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const item = entry.target;
                        if (item.dataset.rendered === "false") {
                            renderThumbnail(parseInt(item.dataset.pageIndex), item);
                        }
                    }
                });
            }, {
                root: container,
                rootMargin: '120px 0px 120px 0px'
            });

            document.querySelectorAll('.thumb-item').forEach(el => thumbObserver.observe(el));
            updateActiveThumbnail(parseInt(document.getElementById('page-input').value) || 1);
        }

        function renderThumbnail(pageNum, item) {
            item.dataset.rendered = "true";

            if (currentDocType === 'image') {
                if (!currentImageFiles || !currentImageFiles[pageNum - 1]) return;
                const file = currentImageFiles[pageNum - 1];

                const drawThumb = (img) => {
                    const thumbCanvas = document.createElement('canvas');
                    const thumbW = 70;
                    const aspect = (img.naturalHeight || 600) / (img.naturalWidth || 800);
                    const thumbH = Math.round(thumbW * aspect);

                    thumbCanvas.width = thumbW;
                    thumbCanvas.height = thumbH;
                    const ctx = thumbCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, thumbW, thumbH);

                    item.innerHTML = '';
                    item.appendChild(thumbCanvas);
                    const label = document.createElement('div');
                    label.className = 'thumb-label';
                    label.innerText = pageNum;
                    item.appendChild(label);
                };

                const cachedImg = imageElementsCache[file.name];
                if (cachedImg && cachedImg.complete) {
                    drawThumb(cachedImg);
                } else {
                    const img = new Image();
                    img.onload = () => {
                        imageElementsCache[file.name] = img;
                        drawThumb(img);
                    };
                    if (file instanceof File || file instanceof Blob) {
                        img.src = URL.createObjectURL(file);
                    } else if (typeof file === 'string') {
                        img.src = file;
                    }
                }
                return;
            }

            if (!currentPdfDoc) return;

            currentPdfDoc.getPage(pageNum).then(page => {
                const viewportDefault = getPageViewport(page, 1);
                const scale = 70 / viewportDefault.width;
                const viewport = getPageViewport(page, scale);

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    item.innerHTML = '';
                    item.appendChild(canvas);
                    const label = document.createElement('div');
                    label.className = 'thumb-label';
                    label.innerText = pageNum;
                    item.appendChild(label);
                }).catch(() => { });
            }).catch(() => { });
        }

        function updateActiveThumbnail(pageNum) {
            const items = document.querySelectorAll('.thumb-item');
            items.forEach(item => {
                if (parseInt(item.dataset.pageIndex) === parseInt(pageNum)) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        document.getElementById('page-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { scrollToPage(parseInt(e.target.value), true); e.target.blur(); }
        });

        document.getElementById('btn-page-prev').addEventListener('click', () => {
            const currentPage = parseInt(document.getElementById('page-input').value) || 1;
            scrollToPage(currentPage - 1, true);
        });

        document.getElementById('btn-page-next').addEventListener('click', () => {
            const currentPage = parseInt(document.getElementById('page-input').value) || 1;
            scrollToPage(currentPage + 1, true);
        });

        pdfContainer.addEventListener('scroll', () => {
            if (viewMode === 'single') return;
            const wrappers = document.querySelectorAll('.page-wrapper');
            let current = 1;
            const containerCenter = pdfContainer.getBoundingClientRect().top + pdfContainer.clientHeight / 2;

            for (let wrapper of wrappers) {
                const rect = wrapper.getBoundingClientRect();
                if (rect.top < containerCenter) current = parseInt(wrapper.dataset.pageIndex);
                else break;
            }

            const pageInput = document.getElementById('page-input');
            if (pageInput.value != current && document.activeElement !== pageInput) {
                pageInput.value = current;
                localStorage.setItem('pdf_last_page', current);
                updateActiveThumbnail(current);
                triggerNeighborhoodPreload(current, 1.5);
            }
        });

        // === 画板引擎与精准增量撤销/重做 (持久化缓存支持) ===
        function saveActionState(pageIndex, prevDataUrl, nextDataUrl) {
            pageIndex = parseInt(pageIndex);
            historyStack.push({ pageIndex, prevDataUrl, nextDataUrl });
            redoStack = [];
            pageLatestData[pageIndex] = nextDataUrl;
            saveCurrentDocumentNotes();
        }

        function restorePageCanvas(pageIndex, canvas) {
            pageIndex = parseInt(pageIndex);
            const dataUrl = pageLatestData[pageIndex];
            if (dataUrl) {
                const img = new Image();
                img.onload = () => {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = dataUrl;
            }
        }

        function drawCanvasState(pageIndex, dataUrl) {
            pageIndex = parseInt(pageIndex);
            pageLatestData[pageIndex] = dataUrl || null;
            saveCachedMedia('cached_pdf_annotations', pageLatestData);
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-index="${pageIndex}"]`);
            if (targetWrapper) {
                const canvas = targetWrapper.querySelector('.draw-canvas');
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (dataUrl) {
                        const img = new Image();
                        img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                        img.src = dataUrl;
                    }
                }
            }
        }

        function initDrawingEvents(canvas, pageIndex) {
            updateCanvasCursor();
            const ctx = canvas.getContext('2d');
            canvas.addEventListener('mousedown', (e) => {
                if (currentTool === 'view') return;
                const rect = canvas.getBoundingClientRect();
                lastX = e.clientX - rect.left; lastY = e.clientY - rect.top;

                if (['draw', 'highlight', 'eraser'].includes(currentTool)) {
                    isDrawing = true;
                    strokeBeforeDataUrl = canvas.toDataURL();
                } else if (currentTool === 'text') {
                    const activeBox = document.querySelector('.temp-text-box');
                    if (activeBox) {
                        const textarea = activeBox.querySelector('.temp-text-area');
                        if (textarea && textarea.value.trim() !== '') {
                            // 若已输入内容，点击新位置自动提交上一题并直接在新的位置开辟新打字框 (实现极速连续填空)
                            closeActiveTextInput(true);
                            strokeBeforeDataUrl = canvas.toDataURL();
                            showTextInput(canvas, pageIndex, lastX, lastY);
                        } else if (activeBox._relocateTo) {
                            // 若未输入内容，直接将【|】光标与窗口闪现重定位至新的点击处
                            activeBox._relocateTo(canvas, lastX, lastY);
                        }
                        return;
                    }
                    strokeBeforeDataUrl = canvas.toDataURL();
                    showTextInput(canvas, pageIndex, lastX, lastY);
                } else if (currentTool === 'note') {
                    createStickyNoteAt(canvas, pageIndex, lastX, lastY);
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;

                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);

                if (currentTool === 'draw') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.stroke();
                } else if (currentTool === 'highlight') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 20; ctx.lineCap = 'square'; ctx.lineJoin = 'round';
                    ctx.stroke();
                } else if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = 30; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.stroke();
                }
                lastX = x; lastY = y;
            });

            const stopDrawing = () => {
                if (isDrawing) {
                    isDrawing = false;
                    const strokeAfterDataUrl = canvas.toDataURL();
                    if (strokeAfterDataUrl !== strokeBeforeDataUrl) {
                        saveActionState(pageIndex, strokeBeforeDataUrl, strokeAfterDataUrl);
                    }
                }
            };
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
        }

        function showTextInput(canvas, pageIndex, x, y) {
            if (document.querySelector('.temp-text-box')) return;

            const wrapper = canvas.parentElement;

            let targetX = x;
            let targetY = y;

            // 1. 创建位于 PDF Canvas 点击处的【|】闪烁光标竖线 (带有 🎯 准星，支持在页面上直接拖拽微调)
            const targetCaret = document.createElement('div');
            targetCaret.className = 'canvas-text-caret';
            targetCaret.title = '按住拖拽微调【|】光标与打字窗口联动位置';
            targetCaret.style.left = (canvas.offsetLeft + targetX) + 'px';
            targetCaret.style.top = (canvas.offsetTop + targetY - 18) + 'px';
            wrapper.appendChild(targetCaret);

            // 2. 创建悬浮打字窗口
            const box = document.createElement('div');
            box.className = 'temp-text-box';

            box.innerHTML = `
                <div class="text-box-header" id="text-drag-handle" title="按住此处拖动打字窗口 (【|】光标同步联动)">
                    <span>✍️ 打字窗口 (【|】光标为文字落脚起点)</span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <button class="btn-text-confirm" id="btn-text-ok" title="确认写入 (Ctrl+Enter)">✅ 完成</button>
                        <button class="btn-text-close" id="btn-text-cancel" title="取消">✖</button>
                    </div>
                </div>
                <textarea class="temp-text-area" placeholder="在此输入文字，按 Enter 换行..."></textarea>
            `;

            wrapper.appendChild(box);

            const textarea = box.querySelector('.temp-text-area');
            const header = box.querySelector('#text-drag-handle');
            const btnOk = box.querySelector('#btn-text-ok');
            const btnCancel = box.querySelector('#btn-text-cancel');

            // 智能计算输入框的最佳避让初显示位置 (防右侧遮挡靠左弹出，防底部遮挡靠上弹出，永不超出容器)
            function calculateSmartBoxPos() {
                const boxW = box.offsetWidth || 230;
                const boxH = box.offsetHeight || 90;

                const caretAbsLeft = canvas.offsetLeft + targetX;
                const caretAbsTop = canvas.offsetTop + targetY - 18;

                const containerW = pdfContainer.clientWidth;
                const containerH = pdfContainer.clientHeight;
                const scrollLeft = pdfContainer.scrollLeft;
                const scrollTop = pdfContainer.scrollTop;

                let left = caretAbsLeft + 25;
                let top = caretAbsTop - 15;

                // 判断右侧超出容器 -> 靠光标左侧弹出
                if (caretAbsLeft + 25 + boxW > scrollLeft + containerW - 30) {
                    left = caretAbsLeft - boxW - 15;
                }
                // 判断下方超出容器 -> 靠光标上方弹出
                if (caretAbsTop + boxH > scrollTop + containerH - 30) {
                    top = caretAbsTop - boxH - 10;
                }

                // 边界钳制，保证永远在可视区之内
                left = Math.max(scrollLeft + 10, Math.min(left, scrollLeft + containerW - boxW - 20));
                top = Math.max(scrollTop + 10, Math.min(top, scrollTop + containerH - boxH - 20));

                box.style.left = left + 'px';
                box.style.top = top + 'px';
            }

            calculateSmartBoxPos();

            // 外部点击新位置重定位辅助方法
            box._relocateTo = (newCanvas, newX, newY) => {
                targetX = newX;
                targetY = newY;
                targetCaret.style.left = (newCanvas.offsetLeft + targetX) + 'px';
                targetCaret.style.top = (newCanvas.offsetTop + targetY - 18) + 'px';
                calculateSmartBoxPos();
                setTimeout(() => textarea.focus(), 50);
            };

            // 自动根据输入内容调整高度
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.max(44, textarea.scrollHeight) + 'px';
            });

            setTimeout(() => textarea.focus(), 50);

            // === 3. 双向绑定联动拖拽机制 (拖拽光标或输入框，二者均整体跟随联动) ===
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let caretInitialLeft = 0, caretInitialTop = 0;
            let boxInitialLeft = 0, boxInitialTop = 0;

            function startLinkedDrag(e) {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                caretInitialLeft = targetCaret.offsetLeft;
                caretInitialTop = targetCaret.offsetTop;
                boxInitialLeft = box.offsetLeft;
                boxInitialTop = box.offsetTop;
                e.preventDefault();
                e.stopPropagation();
            }

            targetCaret.addEventListener('mousedown', startLinkedDrag);
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('#btn-text-ok') || e.target.closest('#btn-text-cancel')) return;
                startLinkedDrag(e);
            });

            const onDragMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;

                const newCaretLeft = caretInitialLeft + dx;
                const newCaretTop = caretInitialTop + dy;

                targetCaret.style.left = newCaretLeft + 'px';
                targetCaret.style.top = newCaretTop + 'px';
                box.style.left = (boxInitialLeft + dx) + 'px';
                box.style.top = (boxInitialTop + dy) + 'px';

                // 实时更新绘制目标起点坐标
                targetX = newCaretLeft - canvas.offsetLeft;
                targetY = newCaretTop - canvas.offsetTop + 18;
            };

            const onDragEnd = () => {
                isDragging = false;
            };

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);


            // 提交文字绘制到 Canvas
            let isCommitted = false;
            const commitText = () => {
                if (isCommitted) return;
                isCommitted = true;

                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);

                const val = textarea.value;
                if (val && val.trim() !== '') {
                    // 核心逻辑：以【|】光标的起点坐标作为文字绘制起点
                    const finalCanvasX = targetX;
                    const finalCanvasY = targetY;

                    const ctx = canvas.getContext('2d');
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.font = 'bold 20px Arial';
                    ctx.fillStyle = '#e74c3c';
                    ctx.textBaseline = 'alphabetic';

                    const lines = val.split('\n');
                    const lineHeight = 26;

                    lines.forEach((line, i) => {
                        ctx.fillText(line, finalCanvasX, finalCanvasY + (i * lineHeight));
                    });

                    const strokeAfterDataUrl = canvas.toDataURL();
                    if (strokeAfterDataUrl !== strokeBeforeDataUrl) {
                        saveActionState(pageIndex, strokeBeforeDataUrl, strokeAfterDataUrl);
                    }
                }

        document.body.appendChild(fxCanvas);
        const fxCtx = fxCanvas.getContext('2d');
        let particles = [];
        let animFrameId = null;

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);

        const CONFETTI_COLORS = [
            '#ff4757', '#ffa502', '#2ed573', '#1e90ff',
            '#3742fa', '#70a6ff', '#e84393', '#00d2d3',
            '#ffda79', '#ff793f', '#cd84f1'
        ];

        function spawnHandGrabBurst(x, y, count = 18) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2.5 + Math.random() * 6.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.2,
                    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                    size: 4 + Math.random() * 5,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.25,
                    alpha: 1.0,
                    decay: 0.022 + Math.random() * 0.02,
                    shape: Math.random() > 0.3 ? 'circle' : (Math.random() > 0.5 ? 'rect' : 'star')
                });
            }
            if (!animFrameId) animFrameId = requestAnimationFrame(updateAndDrawParticles);
        }

        function spawnTrailParticle(x, y) {
            if (Math.random() > 0.4) return;
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.5 + Math.random() * 2;
            particles.push({
                x: x + (Math.random() - 0.5) * 12,
                y: y + (Math.random() - 0.5) * 12,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.5,
                color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                size: 3 + Math.random() * 3,
                rotation: 0,
                vRot: 0,
                alpha: 0.85,
                decay: 0.04 + Math.random() * 0.03,
                shape: 'circle'
            });
            if (!animFrameId) animFrameId = requestAnimationFrame(updateAndDrawParticles);
        }

        function updateAndDrawParticles() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.rotation += p.vRot;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                fxCtx.save();
                fxCtx.globalAlpha = Math.max(0, p.alpha);
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.rotation);
                fxCtx.fillStyle = p.color;

                if (p.shape === 'circle') {
                    fxCtx.beginPath();
                    fxCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    fxCtx.fill();
                } else if (p.shape === 'rect') {
                    fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                } else if (p.shape === 'star') {
                    fxCtx.beginPath();
                    for (let j = 0; j < 5; j++) {
                        fxCtx.lineTo(Math.cos((18 + j * 72) * Math.PI / 180) * p.size, -Math.sin((18 + j * 72) * Math.PI / 180) * p.size);
                        fxCtx.lineTo(Math.cos((54 + j * 72) * Math.PI / 180) * (p.size / 2), -Math.sin((54 + j * 72) * Math.PI / 180) * (p.size / 2));
                    }
                    fxCtx.closePath();
                    fxCtx.fill();
                }
                fxCtx.restore();
            }

            if (particles.length > 0) {
                animFrameId = requestAnimationFrame(updateAndDrawParticles);
            } else {
                animFrameId = null;
            }
        }

        // === 📝 单页智能划词选择 & 静默 OCR 缓存引擎 ===

        let pageOcrCache = {};          // OCR 本地持久化缓存池
        let tesseractWorkerPromise = null;

        function loadTesseractLibrary() {
            if (window.Tesseract) return Promise.resolve();
            if (tesseractWorkerPromise) return tesseractWorkerPromise;

            tesseractWorkerPromise = new Promise((resolve, reject) => {
                showToast("⏳ 首次使用 OCR，正在加载识别引擎模块...");

                script.onload = () => {

                    resolve();
                };
                script.onerror = () => {
                    showToast("❌ OCR 引擎网络加载失败");
                    reject(new Error("Tesseract load error"));

            return tesseractWorkerPromise;

        function getPdfDocumentKey() {
            if (currentDocType === 'image' && currentImageFiles && currentImageFiles.length > 0) {
                const imgName = currentImageFiles[0] ? currentImageFiles[0].name : 'img_doc';
                return `img_${currentImageFiles.length}_${imgName}`;
            }
            if (!currentPdfDoc) return 'doc_key';
            const pageCount = currentPdfDoc.numPages || 0;
            const fp = (currentPdfDoc.fingerprints && currentPdfDoc.fingerprints[0]) ? currentPdfDoc.fingerprints[0] : '';
            return `doc_${pageCount}_${fp}`;
        }

        // 切换划词选择图层 (主开关)
        async function toggleSelectionLayer(forceState = null) {
            const hasDoc = (currentDocType === 'image' && currentImageFiles && currentImageFiles.length > 0) || !!currentPdfDoc;
            if (!hasDoc) {
                showToast("⚠️ 请先导入并加载 PDF 文档或图片");

            isSelectLayerActive = (forceState !== null) ? forceState : !isSelectLayerActive;

            const toolBtn = document.getElementById('tool-extract-text');
            if (toolBtn) toolBtn.classList.toggle('active', isSelectLayerActive);

            wrappers.forEach(w => {

        // 处理当前页的划词透明图层 (含缓存读取与静默 OCR)
        async function processCurrentPageSelectionLayer(currentPageNum) {
            const targetWrapper = document.querySelector(`.page-wrapper[data-page-index="${currentPageNum}"]`);
            if (!targetWrapper) return;

            let layer = targetWrapper.querySelector('.ocr-text-layer');
            if (!layer) {
                layer = document.createElement('div');
                layer.className = 'ocr-text-layer';
                targetWrapper.appendChild(layer);
            }
            layer.style.display = 'block';

            // 1. 只有 PDF 文档优先尝试解析原生矢量文本
            if (currentPdfDoc) {
                try {
                    const page = await currentPdfDoc.getPage(currentPageNum);
                    const textContent = await page.getTextContent();
                    if (textContent && textContent.items && textContent.items.length > 0) {
                        let hasText = false;
                        textContent.items.forEach(item => { if (item.str && item.str.trim()) hasText = true; });
                        if (hasText) {
                            createInvisibleTextLayer(currentPageNum, targetWrapper);
                            showToast("⚡ 已开启原生划词选择 (直接用鼠标划词复制)");
                            return;
                        }
                    }
                } catch (e) {
                    console.warn("读取原生文本异常:", e);
                }
            }

            // 2. 扫描件/图片页：检查本地 OCR 缓存
            const docKey = getPdfDocumentKey();
            const cacheKey = `${docKey}_p${currentPageNum}`;

            if (pageOcrCache[cacheKey] && pageOcrCache[cacheKey].length > 0) {
                const pdfCanvas = targetWrapper.querySelector('.pdf-canvas');
                createOcrOverlayTextLayer(pageOcrCache[cacheKey], targetWrapper, pdfCanvas ? pdfCanvas.width : null, pdfCanvas ? pdfCanvas.height : null);
                showToast("🔍 划词选择已就绪 (0ms 来自 OCR 本地缓存)");
                return;
            }

            // 3. 无缓存时：静默触发全页 OCR (根据底图画布直接捕获)
            showToast("⏳ 正在后台静默识别当前页图像文字...");
            try {
                await loadTesseractLibrary();

                const pdfCanvas = targetWrapper.querySelector('.pdf-canvas');
                let imageSource = pdfCanvas ? pdfCanvas.toDataURL('image/png') : null;

                if (!imageSource && currentPdfDoc) {
                    const page = await currentPdfDoc.getPage(currentPageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    const ctx = tempCanvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    imageSource = tempCanvas.toDataURL('image/png');
                }

                if (!imageSource) {
                    showToast("⚠️ 未获取到有效图像画面，无法识别");
                    return;
                }

                let worker;
                try {
                    worker = await Tesseract.createWorker('por+spa+eng+chi_sim', 1);
                } catch (langErr) {
                    worker = await Tesseract.createWorker('chi_sim+eng', 1);
                }
                const ret = await worker.recognize(imageSource);
                await worker.terminate();

                if (ret.data && ret.data.words && ret.data.words.length > 0) {
                    pageOcrCache[cacheKey] = ret.data.words;
                    saveCachedMedia('cached_pdf_ocr_results', pageOcrCache);

                    const pdfCanvasEl = targetWrapper.querySelector('.pdf-canvas');
                    createOcrOverlayTextLayer(ret.data.words, targetWrapper, pdfCanvasEl ? pdfCanvasEl.width : null, pdfCanvasEl ? pdfCanvasEl.height : null);
                    showToast("✅ 图像 OCR 静默识别完成！已开启划词选择");
                } else {
                    showToast("ℹ️ 当前页面未识别出有效文字图像");
                }
            } catch (err) {
                console.error("静默 OCR 发生错误:", err);
                showToast("❌ OCR 图像识别失败：" + (err.message || err));
            }
        }

        // === 隐形划词选择透明文本图层渲染器 (支持 Block 段落隔离与精确偏高修复) ===
        async function createInvisibleTextLayer(pageNum, wrapper) {
            if (!currentPdfDoc || !wrapper) return;

            let layer = wrapper.querySelector('.ocr-text-layer');
            if (!layer) {
                layer = document.createElement('div');
                layer.className = 'ocr-text-layer';
                wrapper.appendChild(layer);
            }

            if (layer.children.length > 0) return;

            try {
                const page = await currentPdfDoc.getPage(pageNum);
                const textContent = await page.getTextContent();

                if (textContent && textContent.items && textContent.items.length > 0) {
                    const viewport = page.getViewport({ scale: 1 });
                    const pdfCanvas = wrapper.querySelector('.pdf-canvas');
                    const realW = pdfCanvas ? pdfCanvas.width : viewport.width;
                    const realH = pdfCanvas ? pdfCanvas.height : viewport.height;

                    const scaleX = wrapper.clientWidth / viewport.width;
                    const scaleY = wrapper.clientHeight / viewport.height;

                    const frag = document.createDocumentFragment();
                    textContent.items.forEach(item => {
                        if (!item.str || !item.str.trim()) return;
                        const tx = item.transform[4];
                        const ty = item.transform[5];
                        const fontH = Math.abs(item.transform[3] || item.height || 12);

                        const x = tx * scaleX;
                        const y = (viewport.height - ty - fontH * 0.82) * scaleY; // 精准基线对齐校正
                        const w = (item.width || (item.str.length * fontH * 0.6)) * scaleX;
                        const h = fontH * scaleY;

                        const span = document.createElement('span');
                        span.className = 'ocr-word';
                        span.style.cssText = `
                            left: ${x.toFixed(1)}px;
                            top: ${y.toFixed(1)}px;
                            width: ${Math.max(12, w).toFixed(1)}px;
                            height: ${Math.max(12, h).toFixed(1)}px;
                            font-size: ${Math.max(10, h * 0.9).toFixed(1)}px;
                        `;
                        span.innerText = item.str;
                        frag.appendChild(span);
                    });
                    layer.appendChild(frag);
                }
            } catch (err) {
                console.warn(`渲染第 ${pageNum} 页透明矢量文本层失败:`, err);
            }
        }

        // 渲染按【板块/段落 Block 物理隔离】的透明 OCR 文字层
        function createOcrOverlayTextLayer(words, wrapper, imgW, imgH) {
            if (!wrapper || !words || words.length === 0) return;

            let layer = wrapper.querySelector('.ocr-text-layer');
            if (!layer) {
                layer = document.createElement('div');
                layer.className = 'ocr-text-layer';
                wrapper.appendChild(layer);
            }
            layer.innerHTML = '';

            const canvasEl = wrapper.querySelector('.pdf-canvas');
            const refW = imgW || (canvasEl ? canvasEl.width : wrapper.clientWidth);
            const refH = imgH || (canvasEl ? canvasEl.height : wrapper.clientHeight);

            const scaleX = wrapper.clientWidth / refW;
            const scaleY = wrapper.clientHeight / refH;

            // 按 Y 轴物理距离分组为独立段落 Block 容器 (防止跨列串行混选)
            const blocks = [];
            const sortedWords = [...words].sort((a, b) => (a.bbox.y0 - b.bbox.y0));

            sortedWords.forEach(word => {
                if (!word.text || !word.text.trim()) return;
                const bbox = word.bbox || { x0: 0, y0: 0, x1: 50, y1: 20 };

                // 寻找已有的同排/同 Block 容器 (Y0 差异小于 18px 且 X 轴相邻)
                let matchedBlock = blocks.find(b =>
                    Math.abs(b.y0 - bbox.y0) < 18 &&
                    (bbox.x0 - b.x1 < 100 && b.x0 - bbox.x1 < 100)
                );

                if (!matchedBlock) {
                    matchedBlock = {
                        x0: bbox.x0, y0: bbox.y0, x1: bbox.x1, y1: bbox.y1,
                        words: []
                    };
                    blocks.push(matchedBlock);
                } else {
                    matchedBlock.x0 = Math.min(matchedBlock.x0, bbox.x0);
                    matchedBlock.y0 = Math.min(matchedBlock.y0, bbox.y0);
                    matchedBlock.x1 = Math.max(matchedBlock.x1, bbox.x1);
                    matchedBlock.y1 = Math.max(matchedBlock.y1, bbox.y1);
                }
                matchedBlock.words.push(word);
            });

            const frag = document.createDocumentFragment();

            blocks.forEach(blk => {
                const bx = blk.x0 * scaleX;
                const by = blk.y0 * scaleY + 2; // 精确向下偏移 2px，死死贴合字符
                const bw = (blk.x1 - blk.x0) * scaleX;
                const bh = (blk.y1 - blk.y0) * scaleY;

                const blockDiv = document.createElement('div');
                blockDiv.className = 'ocr-block';
                blockDiv.style.cssText = `
                    left: ${bx.toFixed(1)}px;
                    top: ${by.toFixed(1)}px;
                    width: ${Math.max(15, bw).toFixed(1)}px;
                    height: ${Math.max(12, bh).toFixed(1)}px;
                `;

                blk.words.forEach(word => {
                    const bbox = word.bbox;
                    const wx = (bbox.x0 - blk.x0) * scaleX;
                    const wy = (bbox.y0 - blk.y0) * scaleY;
                    const ww = (bbox.x1 - bbox.x0) * scaleX;
                    const wh = (bbox.y1 - bbox.y0) * scaleY;

                    let angle = 0;
                    if (word.baseline && (word.baseline.x1 - word.baseline.x0) !== 0) {
                        const dx = word.baseline.x1 - word.baseline.x0;
                        const dy = word.baseline.y1 - word.baseline.y0;
                        angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    }

                    const span = document.createElement('span');
                    span.className = 'ocr-word';
                    span.style.cssText = `
                        left: ${wx.toFixed(1)}px;
                        top: ${wy.toFixed(1)}px;
                        width: ${Math.max(10, ww).toFixed(1)}px;
                        height: ${Math.max(10, wh).toFixed(1)}px;
                        font-size: ${Math.max(9, wh * 0.88).toFixed(1)}px;
                        ${angle !== 0 ? `transform: rotate(${angle.toFixed(1)}deg);` : ''}
                    `;
                    span.innerText = word.text;
                    blockDiv.appendChild(span);
                });

                frag.appendChild(blockDiv);
            });

            layer.appendChild(frag);
        }

        // === 📜 历史加载与音频卸载控制引擎 ===
        let historyRecords = [];
        let audioHistoryRecords = [];
        let currentHistoryTab = 'all'; // 'all' (总表), 'pdf' (PDF), 'audio' (音频)

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const m = (d.getMonth() + 1).toString().padStart(2, '0');
            const day = d.getDate().toString().padStart(2, '0');
            const h = d.getHours().toString().padStart(2, '0');
            const min = d.getMinutes().toString().padStart(2, '0');
            return `${m}-${day} ${h}:${min}`;
        }

        function isAudioFileName(name) {
            if (!name) return false;
            const n = name.toLowerCase();
            return n.endsWith('.mp3') || n.endsWith('.m4a') || n.endsWith('.wav') || n.endsWith('.wma') || n.endsWith('.aac') || n.endsWith('.flac') || n.endsWith('.ogg');
        }

        function isImageFileName(name) {
            if (!name) return false;
            const n = name.toLowerCase();
            return n.endsWith('.png') || n.endsWith('.jpg') || n.endsWith('.jpeg') || n.endsWith('.webp') || n.endsWith('.gif') || n.endsWith('.svg') || n.endsWith('.bmp');
        }

        async function unloadCurrentAudio() {
            if (player) {
                player.pause();
                player.src = '';
                if (player._currentBlobUrl) {
                    URL.revokeObjectURL(player._currentBlobUrl);
                    player._currentBlobUrl = null;
                }

            audioFiles = [];
            currentIndex = 0;

            try {
                await saveCachedMedia('cached_audio_files', []);
                localStorage.removeItem('audio_last_index');
            } catch (e) { }

            if (titleEl) {
                titleEl.innerText = "等待加载音频...";
                titleEl.title = "等待加载音频...";
            }
            if (hoverMusicTitle) hoverMusicTitle.innerText = "等待加载音频...";
            if (audioPanel) audioPanel.title = "";
            if (timeCurrent) timeCurrent.innerText = "00:00";
            if (timeTotal) timeTotal.innerText = "00:00";
            if (progressFill) progressFill.style.width = "0%";
            if (progressHandle) progressHandle.style.left = "0%";
            if (playlistMenu) {

        async function saveAudioFilesToHistory(files) {
            if (!files || files.length === 0) return;
            try {
                let records = (await getCachedMedia('audio_history_records')) || [];

                const validAudioFiles = Array.from(files).filter(file => file && isAudioFileName(file.name));
                if (validAudioFiles.length === 0) return;

                const totalSize = validAudioFiles.reduce((sum, f) => sum + (f.size || 0), 0);

                let displayName = '';
                let isFolder = false;

                if (validAudioFiles.length === 1) {
                    displayName = validAudioFiles[0].name;
                    isFolder = false;
                } else {
                    isFolder = true;
                    let folderName = '';
                    if (validAudioFiles[0].webkitRelativePath) {
                        const parts = validAudioFiles[0].webkitRelativePath.split('/');
                        if (parts.length > 1) folderName = parts[0];
                    }

                    if (folderName) {
                        displayName = folderName;
                    } else {
                        displayName = `${validAudioFiles[0].name} 等 (${validAudioFiles.length}首音频)`;
                    }
                }

                const recordId = 'audio_hist_group_' + validAudioFiles[0].name + '_' + validAudioFiles.length + '_' + totalSize;

                records = records.filter(r => r.id !== recordId);

                records.unshift({
                    id: recordId,
                    name: displayName,
                    size: totalSize,
                    count: validAudioFiles.length,
                    isFolder: isFolder,
                    formattedSize: formatBytes(totalSize),
                    time: Date.now(),
                    formattedTime: formatDateTime(Date.now()),
                    type: 'audio',
                    files: validAudioFiles,
                    file: validAudioFiles[0]
                });

                audioHistoryRecords = records.slice(0, 30);
                await saveCachedMedia('audio_history_records', audioHistoryRecords);
            } catch (err) {
                console.warn('保存音频历史记录失败:', err);
            }
        }

        async function saveFileToHistory(file, numPages = null, docType = 'pdf', allFiles = null) {
            if (!file || !file.name) return;
            try {
                const records = (await getCachedMedia('pdf_history_records')) || [];
                const recordId = 'hist_' + file.name + '_' + (file.size || 0);

                const filtered = records.filter(r => r.id !== recordId);
                const isImg = (docType === 'image' || isImageFileName(file.name));

                let displayName = file.name;
                if (isImg && allFiles && allFiles.length > 1) {
                    let folderName = '';
                    if (allFiles[0].webkitRelativePath) {
                        const parts = allFiles[0].webkitRelativePath.split('/');
                        if (parts.length > 1) folderName = parts[0];
                    }
                    if (folderName) displayName = folderName;
                }

                const newRecord = {
                    id: recordId,
                    name: displayName,
                    size: file.size,
                    formattedSize: formatBytes(file.size),
                    time: Date.now(),
                    formattedTime: formatDateTime(Date.now()),
                    numPages: numPages,
                    type: isImg ? 'image' : 'pdf',
                    file: file,
                    files: allFiles || [file]
                };

                filtered.unshift(newRecord);
                historyRecords = filtered.slice(0, 20);
                await saveCachedMedia('pdf_history_records', historyRecords);
            } catch (err) {
                console.warn('保存历史记录失败:', err);

        }
